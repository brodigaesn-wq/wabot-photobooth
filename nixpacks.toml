[phases.setup]
aptPkgs = [
  "chromium",
  "libnss3",
  "libnspr4",
  "libatk1.0-0",
  "libatk-bridge2.0-0",
  "libcups2",
  "libdrm2",
  "libxkbcommon0",
  "libxcomposite1",
  "libxdamage1",
  "libxfixes3",
  "libxrandr2",
  "libgbm1",
  "libasound2t64",
  "libpangocairo-1.0-0",
  "libpango-1.0-0",
  "libcairo2",
  "libglib2.0-0",
  "libgtk-3-0",
  "libx11-6",
  "libx11-xcb1",
  "libxcb1",
  "libxext6",
  "libxrender1",
  "libxtst6",
  "libxss1",
  "libatspi2.0-0",
  "fonts-liberation",
  "libsecret-1-0",
  "ca-certificates",
  "wget",
  "xdg-utils"
]

[variables]
PUPPETEER_SKIP_DOWNLOAD = "true"
PUPPETEER_EXECUTABLE_PATH = "/usr/bin/chromium"
